name: Telemetry Ingest (Fully Automated)

on:
  schedule:
    - cron: '0 0,12 * * *' # Automatically runs every 12 hours (00:00 & 12:00 UTC)
  workflow_dispatch:
    inputs:
      min_count:
        description: 'Minimum report count threshold'
        required: true
        default: '2'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Telemetry Ingest
        env:
          TELEMETRY_EXPORT_URL: "https://telemetry-wynntranslator.focalsalt.net/api/telemetry/export"
          TELEMETRY_ADMIN_KEY: ${{ secrets.TELEMETRY_ADMIN_KEY }}
        run: |
          MIN_COUNT="${{ inputs.min_count || '2' }}"
          python tools/ingest_telemetry.py --min-count "$MIN_COUNT"

      - name: Commit and Push New Strings Directly to Main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat(telemetry): automatically ingest newly reported strings'
          file_pattern: 'languages/en_us/**'
