name: Telemetry Ingest & PR

on:
  schedule:
    - cron: '0 1 * * 0' # Automatically run every Sunday at 01:00 UTC
  workflow_dispatch:
    inputs:
      min_count:
        description: 'Minimum report count threshold'
        required: true
        default: '2'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Telemetry Ingest
        env:
          TELEMETRY_EXPORT_URL: "https://telemetry-wynntranslator.focalsalt.net/api/telemetry/export"
          TELEMETRY_ADMIN_KEY: ${{ secrets.TELEMETRY_ADMIN_KEY }}
        run: |
          MIN_COUNT="${{ inputs.min_count || '2' }}"
          python tools/ingest_telemetry.py --min-count "$MIN_COUNT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'feat(telemetry): Ingest newly discovered strings from telemetry'
          title: 'feat(telemetry): Ingest new strings from telemetry'
          body: |
            ### Automated Telemetry Ingest
            New strings have been fetched from the telemetry backend into `languages/en_us/`.
            
            After merging this PR, the `Crowdin Sync` workflow will push these strings to Crowdin for translation.
          branch: telemetry/ingest-new-strings
          delete-branch: true
