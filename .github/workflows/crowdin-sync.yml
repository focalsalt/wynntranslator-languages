name: Crowdin Localization Sync

on:
  push:
    branches: [ main ]
    paths:
      - 'languages/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for Source Files
        id: check_sources
        run: |
          COUNT=$(find languages/en_us -name "*.json" ! -name "manifest.json" | wc -l)
          echo "Found $COUNT source files in languages/en_us"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_sources=true" >> $GITHUB_OUTPUT
          else
            echo "has_sources=false" >> $GITHUB_OUTPUT
            echo "::notice::No translation source JSON files found in languages/en_us yet. Crowdin sync skipped until telemetry texts are ingested."
          fi

      - name: Crowdin Upload Sources & Download Translations
        if: steps.check_sources.outputs.has_sources == 'true'
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: true
          create_pull_request: false
          crowdin_branch_name: main
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recompute Manifest SHA-256
        if: steps.check_sources.outputs.has_sources == 'true'
        run: |
          python tools/update_manifest.py

      - name: Create Pull Request with Translations
        if: steps.check_sources.outputs.has_sources == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(l10n): New Crowdin translations and manifest update'
          title: 'chore(l10n): New Crowdin translations update'
          body: |
            ### Automated Crowdin Translations Sync
            Latest community translations downloaded from Crowdin.
            `manifest.json` and SHA-256 checksums have been automatically recomputed.
          branch: l10n_crowdin_translations
          delete-branch: true
