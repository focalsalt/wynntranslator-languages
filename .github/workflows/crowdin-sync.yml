name: Crowdin Localization Sync

on:
  push:
    branches: [ main ]
    paths:
      - 'languages/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Crowdin Upload Sources & Download Translations
        uses: crowdin/github-action@v2
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: 'chore(l10n): New Crowdin translations update'
          pull_request_body: 'Automated pull request synced from Crowdin.'
          crowdin_branch_name: main
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Recompute Manifest SHA-256
        run: |
          python tools/update_manifest.py

      - name: Commit Updated Manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(l10n): update language pack manifest and sha256 checksums'
          file_pattern: 'languages/**/manifest.json'
